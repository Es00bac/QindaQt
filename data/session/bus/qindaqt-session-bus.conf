# QindaQt hardening for the per-user D-Bus session bus (ADR-0377).
#
# AGENT-NOTE: helpers activated without a SystemdService= run inside this unit's
# cgroup. With the stock OOMPolicy=stop, an out-of-memory kill of any one of them
# stops the whole session bus, and every desktop component loses its connection
# at once (2026-10-02). Kill only the chosen process instead.
#
# AGENT-GUARD: do not lower dbus-daemon's per-connection queue limits here. A
# measured 64 MiB cap makes the daemon stop reading from the *publisher* once its
# messages are stuck behind a subscriber that stopped reading, which blocks
# healthy services. Stalled-subscriber growth is fixed at the source instead:
# subscriptions exist only while needed and high-rate signals are coalesced.
[Service]
OOMPolicy=continue
