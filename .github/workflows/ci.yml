# SPDX-License-Identifier: GPL-3.0-or-later

name: QindaQt CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qindaqt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Scenarios, docs, and source shape
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile dependency-free Python tools
        run: python3 -m compileall -q tools

      - name: Validate development scenarios
        run: ./tools/qindaqt-dev-session --validate-scenarios

      - name: Exercise stable harness interface
        run: |
          ./tools/qindaqt-dev-session --list-scenarios
          ./tools/qindaqt-dev-session --scenario single-1080p --backend preview --dry-run

      - name: Enforce modular source shape
        run: ./tools/check-source-shape

      - name: Validate the release pin and packaging contract
        run: ./tools/check-release-contract

      - name: Install the pinned wiki toolchain
        run: >-
          python3 -m pip install --disable-pip-version-check
          -r docs/requirements.txt

      - name: Validate project wiki and links
        run: |
          ./tools/validate-docs
          python3 -m mkdocs build --strict \
            --site-dir "${RUNNER_TEMP}/qindaqt-wiki"

  core-build:
    name: Configure, build, and test the dependency-light core
    needs: repository-policy
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 30
    steps:
      # AGENT-CONTRACT: Keep mandatory build dependencies explicit here. Do not
      # hide a missing dependency or failed target behind `|| true`; split future
      # compositor integration into a separately provisioned job instead.
      - name: Install build dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            binutils \
            cmake \
            dbus \
            extra-cmake-modules \
            fontconfig \
            git \
            kglobalaccel \
            kidletime \
            kdecoration \
            kio \
            kservice \
            kwayland \
            libnm \
            libwireplumber \
            ninja \
            pipewire \
            pipewire-audio \
            python \
            qt6-base \
            qt6-declarative \
            qt6-svg \
            qt6-wayland \
            wayland \
            wayland-protocols \
            wireplumber \
            qtermwidget \
            syntax-highlighting

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record dependency versions
        run: >-
          pacman -Q binutils cmake dbus extra-cmake-modules fontconfig kdecoration
          kglobalaccel kidletime kio kservice kwayland libnm libwireplumber
          pipewire pipewire-audio qtermwidget
          qt6-base qt6-declarative qt6-svg qt6-wayland wayland
          wayland-protocols wireplumber

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja -DBUILD_TESTING=ON
          -DQINDAQT_BUILD_KWIN_PLUGIN=OFF
          -DQINDAQT_BUILD_PRODUCTION_SHELL=OFF
          -DQINDAQT_ENABLE_HOST_UINPUT_TESTS=OFF

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Smoke-test preview through isolated harness
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ./tools/qindaqt-dev-session --scenario single-1080p --backend preview
          --program ./build/ci/src/shell/qindaqt-shell-preview --smoke-test --execute

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error

  production-shell:
    name: Build and prove production LayerShell panels
    needs: repository-policy
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    timeout-minutes: 30
    steps:
      # AGENT-CONTRACT: This lane deliberately uses the current rolling KWin
      # runtime with QindaQt's binary KWin plugin disabled. It proves the public
      # layer-shell client boundary, not the separately pinned KWin 6.6.6 ABI.
      - name: Install production shell and nested-session dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed \
            binutils \
            cmake \
            dbus \
            extra-cmake-modules \
            fontconfig \
            git \
            kdecoration \
            kglobalaccel \
            kwin \
            layer-shell-qt \
            libcap \
            kidletime \
            kio \
            kservice \
            kwayland \
            libnm \
            libwireplumber \
            ninja \
            pipewire \
            pipewire-audio \
            python \
            qt6-base \
            qt6-declarative \
            qt6-svg \
            qt6-wayland \
            wayland \
            wayland-protocols \
            wireplumber \
            qtermwidget syntax-highlighting \
            xorg-xdpyinfo \
            xorg-xwayland

      # Arch gives kwin_wayland CAP_SYS_NICE as a file capability. GitHub's
      # ordinary container bounding set intentionally excludes that
      # capability, which makes execve fail with EPERM before KWin starts.
      # This nested virtual-output lane does not need realtime scheduling, so
      # remove only that packaged file capability inside the disposable job
      # container instead of granting SYS_NICE to every following step.
      - name: Make nested KWin executable in the restricted CI container
        run: |
          kwin_capability="$(getcap /usr/bin/kwin_wayland)"
          case "$kwin_capability" in
            "/usr/bin/kwin_wayland cap_sys_nice=ep")
              setcap -r /usr/bin/kwin_wayland
              ;;
            "")
              ;;
            *)
              echo "unexpected kwin_wayland file capabilities: $kwin_capability" >&2
              exit 1
              ;;
          esac
          test -z "$(getcap /usr/bin/kwin_wayland)"
          kwin_wayland --version

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Record production shell stack
        run: >-
          pacman -Q binutils dbus extra-cmake-modules fontconfig kdecoration kwin
          kglobalaccel kidletime kio kservice kwayland layer-shell-qt libcap
          libnm libwireplumber pipewire pipewire-audio qtermwidget
          syntax-highlighting qt6-base
          qt6-declarative qt6-svg qt6-wayland xorg-xwayland
          wayland wayland-protocols wireplumber

      - name: Configure production shell without the binary KWin plugin
        run: >-
          cmake -S . -B build/ci-production -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DQINDAQT_BUILD_KWIN_PLUGIN=OFF
          -DQINDAQT_BUILD_SHELL=ON
          -DQINDAQT_BUILD_PRODUCTION_SHELL=ON
          -DQINDAQT_ENABLE_HOST_UINPUT_TESTS=OFF

      - name: Build production shell and probes
        run: cmake --build build/ci-production --parallel 2

      - name: Test backend-neutral panel surfaces
        run: |
          ctest --test-dir build/ci-production \
            -R '^qindaqt\.shell-surface-configuration$' \
            --output-on-failure --no-tests=error
          ctest --test-dir build/ci-production \
            -R '^qindaqt\.shell-surface-controller$' \
            --output-on-failure --no-tests=error

      - name: Test production panels under nested KWin
        run: |
          ctest --test-dir build/ci-production \
            -R '^shell\.production-surface\.1080p$' \
            --output-on-failure --no-tests=error
          ctest --test-dir build/ci-production \
            -R '^shell\.production-surface\.wuxga$' \
            --output-on-failure --no-tests=error
          ctest --test-dir build/ci-production \
            -R '^shell\.production-surface\.1440p$' \
            --output-on-failure --no-tests=error

  native-release:
    name: Build and boot the KWin 6.6.6 plugin
    needs: repository-policy
    runs-on: ubuntu-24.04
    container:
      # Dated 2026-09-07. Pin the amd64 systemd image so the base does not move
      # underneath the exact Portage repository and desktop profile below.
      image: gentoo/stage3@sha256:35356fe25c32d5c94c04b4d40a046223c342ae7126fe0bffa052e15331c9cec8
    timeout-minutes: 60
    env:
      MAKEOPTS: -j2
      NINJAFLAGS: -j2
    steps:
      - name: Install the pinned Gentoo repository snapshot
        env:
          GENTOO_REPOSITORY_COMMIT: 31e40ddc0b008a861694da39785eee26500a68e6
        run: |
          rm -rf /var/db/repos/gentoo
          mkdir -p /var/db/repos/gentoo
          wget --https-only --quiet \
            "https://github.com/gentoo/gentoo/archive/${GENTOO_REPOSITORY_COMMIT}.tar.gz" \
            -O /tmp/gentoo-repository.tar.gz
          tar -xzf /tmp/gentoo-repository.tar.gz \
            --strip-components=1 -C /var/db/repos/gentoo
          test -f /var/db/repos/gentoo/kde-plasma/kwin/kwin-6.6.6.ebuild
          ln -snf \
            /var/db/repos/gentoo/profiles/default/linux/amd64/23.0/desktop/systemd \
            /etc/portage/make.profile
          mkdir -p /etc/portage/package.use
          cat > /etc/portage/package.use/qindaqt-ci <<'EOF'
          # The native lane compiles and boots QindaQt's plugin. The complete
          # desktop ebuild separately qualifies the lock-screen runtime closure.
          dev-qt/qtbase -accessibility
          kde-plasma/kwin -accessibility -lock -screencast shortcuts
          net-misc/networkmanager -bluetooth -policykit -systemd
          EOF

      # `--usepkgonly` makes absence of a compatible official binary package a
      # hard failure instead of turning this lane into an unbounded distro
      # build. The fixed repository and exact atoms retain dependency metadata.
      - name: Install exact binary native build dependencies
        run: |
          emerge --jobs=2 --getbinpkg --usepkgonly --binpkg-respect-use=y \
            --update --newuse \
            --autounmask=n --autounmask-use=n --autounmask-license=n \
            dev-build/cmake \
            dev-build/ninja \
            dev-vcs/git \
            sys-libs/libcap \
            sys-apps/dbus \
            x11-apps/xdpyinfo \
            x11-base/xwayland \
            dev-libs/wayland \
            dev-libs/wayland-protocols \
            dev-util/wayland-scanner \
            '>=dev-qt/qtbase-6.11:6' \
            '>=dev-qt/qtdeclarative-6.11:6' \
            '>=dev-qt/qtsvg-6.11:6' \
            '=kde-plasma/kwin-6.6.6*:6[shortcuts]' \
            '=kde-plasma/kdecoration-6.6.6*:6' \
            '=kde-plasma/layer-shell-qt-6.6.6*:6' \
            '=kde-plasma/kwayland-6.6.6*:6' \
            '=kde-plasma/plasma-activities-6.6.6*:6' \
            '>=kde-frameworks/extra-cmake-modules-6.0' \
            '>=kde-frameworks/kcoreaddons-6.0:6' \
            '>=kde-frameworks/kglobalaccel-6.0:6' \
            '>=kde-frameworks/kidletime-6.0:6' \
            '>=kde-frameworks/kio-6.0:6' \
            '>=kde-frameworks/kservice-6.0:6' \
            '>=kde-frameworks/syntax-highlighting-6.0:6' \
            '=x11-libs/qtermwidget-2.4*:0' \
            '>=media-video/wireplumber-0.5' \
            '>=net-misc/networkmanager-1.44' \
            media-libs/fontconfig

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The packaged capability cannot be admitted by an ordinary GitHub job
      # container. Nested virtual outputs do not need realtime scheduling.
      - name: Make nested KWin executable in the restricted CI container
        run: |
          kwin_capability="$(getcap /usr/bin/kwin_wayland)"
          case "$kwin_capability" in
            "/usr/bin/kwin_wayland cap_sys_nice=ep")
              setcap -r /usr/bin/kwin_wayland
              ;;
            "")
              ;;
            *)
              echo "unexpected kwin_wayland file capabilities: $kwin_capability" >&2
              exit 1
              ;;
          esac
          test -z "$(getcap /usr/bin/kwin_wayland)"

      - name: Verify the exact runtime and source pin
        run: |
          cmake_version="$(find /usr/lib /usr/lib64 \
            -path '*/cmake/KWin/KWinConfigVersion.cmake' -print -quit)"
          test -n "$cmake_version"
          ./compositor/tools/verify-kwin-source --check-remote
          ./tools/check-release-contract \
            --kwin-wayland /usr/bin/kwin_wayland \
            --kwin-cmake-version "$cmake_version"

      - name: Record the exact native build stack
        run: |
          emerge --info \
            kde-plasma/kwin kde-plasma/kdecoration \
            kde-plasma/layer-shell-qt kde-plasma/kwayland \
            kde-plasma/plasma-activities \
            kde-frameworks/kidletime kde-frameworks/kio kde-frameworks/kservice
          emerge --info \
            media-video/wireplumber net-misc/networkmanager sys-apps/systemd
          /usr/bin/kwin_wayland --version

      - name: Configure the complete release build
        run: >-
          cmake -S . -B build/ci-native-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DQINDAQT_BUILD_KWIN_PLUGIN=ON
          -DQINDAQT_BUILD_SHELL=ON
          -DQINDAQT_BUILD_PRODUCTION_SHELL=ON
          -DQINDAQT_ENABLE_AUDIO_LIVE_RUNTIME_TESTS=OFF
          -DQINDAQT_ENABLE_HOST_UINPUT_TESTS=OFF

      - name: Build the complete production tree and nested probe
        run: >-
          cmake --build build/ci-native-release --parallel 2
          --target src/all qindaqt-session-probe

      - name: Stage the full desktop install
        run: >-
          cmake --install build/ci-native-release
          --prefix "${GITHUB_WORKSPACE}/build/ci-native-release-stage"

      - name: Verify release artifacts and static ABI gates
        run: |
          cmake_version="$(find /usr/lib /usr/lib64 \
            -path '*/cmake/KWin/KWinConfigVersion.cmake' -print -quit)"
          ./tools/check-release-contract \
            --kwin-wayland /usr/bin/kwin_wayland \
            --kwin-cmake-version "$cmake_version" \
            --build-root build/ci-native-release \
            --install-root build/ci-native-release-stage
          ctest --test-dir build/ci-native-release \
            -R '^(compositor\.kwin-abi-pin|compositor\.rejects-conflicting-kwin-abi|compositor\.kwin-plugin-dependency-contract)$' \
            --output-on-failure --no-tests=error

      # Keep compositor processes serialized. Both rows require the plugin's
      # live service; the second also proves relocated installed discovery.
      - name: Boot the plugin under nested KWin
        run: |
          ctest --test-dir build/ci-native-release \
            -R '^compositor\.kwin-plugin-nested$' \
            --output-on-failure --no-tests=error
          ctest --test-dir build/ci-native-release \
            -R '^session\.installed-plugin-discovery$' \
            --output-on-failure --no-tests=error
