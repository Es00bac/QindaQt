<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- ADR-0273: the private session bus of qindaqt.file-manager-file-manager1.
     AGENT-GUARD: keep this free of <servicedir> and
     <standard_session_servicedirs/>. The default session configuration reads
     the host's activation files, so a call to org.freedesktop.FileManager1
     could start the host's own file manager (for example Dolphin's
     org.kde.dolphin.FileManager1.service) instead of reaching the service
     under test. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow send_interface="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
