<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- QindaQt Controls visual gate: host-Noto-hidden proof configuration.

     AGENT-CONTRACT: qindaqt.controls-visual-no-noto-* rows run the visual
     executable with FONTCONFIG_FILE pointed at this file. It keeps the
     documented host font configuration (rendering rules, DejaVu and other
     fallback faces) and rejects exactly the host families the theme catalog
     can name ("Noto Sans", "Noto Sans Mono"), so a fixture that still
     rendered any host Noto byte would drift against the reviewed baselines
     and fail. Rejection is by family pattern, not by directory list, so the
     proof holds wherever the host installs Noto. When a theme starts naming
     another host family, add it here and to the fixture substitution table.
-->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family"><string>Noto Sans</string></patelt>
      </pattern>
      <pattern>
        <patelt name="family"><string>Noto Sans Mono</string></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
