<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- QindaQt private desktop-session sandbox: self-contained fontconfig root.

     AGENT-CONTRACT: the bwrap sandbox in desktop_session_sandbox.py starts
     from an empty tmpfs root, so fontconfig's compiled-in
     /etc/fonts/fonts.conf never exists there and every session client fails
     with "Cannot load default config file". sandbox_environment() points
     FONTCONFIG_FILE at this fixture's path under the `tests` ReadOnlyMount
     (/opt/qindaqt-source), which already binds the whole source_root
     read-only, so this file needs no mount of its own. It deliberately does
     not <include> a host path.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/opt/qindaqt-source/tests/controls/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <match target="pattern">
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
