# QindaQt keeps its own session identity for frontend portal selection. The KDE
# backend uses this private compatibility identity to enable its KWin/EIS
# ScreenCast, Screenshot, RemoteDesktop and InputCapture adaptors without
# changing the desktop-wide environment.
#
# Measured on a live session, same binary and same compositor, only the identity
# differing: with XDG_CURRENT_DESKTOP=KDE the backend registers ScreenCast,
# Screenshot, RemoteDesktop, InputCapture and GlobalShortcuts among 19 impl
# interfaces and takes its bus name in under a second; with QindaQt it registers
# 11 and none of the capture ones. Screen capture - OBS, browsers, Discord -
# depends entirely on this file reaching the process that owns the name.
#
# Type=exec overrides the packaged unit's Type=dbus deliberately (ADR-0170). A
# QindaQt session may run on a private bus it bootstrapped itself:
# SessionBusBootstrap runs dbus-run-session whenever DBUS_SESSION_BUS_ADDRESS is
# unset, which is every host without a user dbus.socket. The systemd user
# manager holds no client connection to that private bus, so it can never
# observe this unit acquiring BusName= and terminates a working backend at
# TimeoutStartSec (90 s). D-Bus activation then respawns the binary directly,
# WITHOUT this drop-in's environment, and that replacement is the one that ends
# up owning the name - with no capture interfaces at all. Type=exec makes
# systemd judge the start by exec success, which is observable on any bus, so
# the backend that keeps the name is the one carrying this identity. Client
# activation is unaffected: dbus-daemon waits for the name on the session bus
# itself, independently of the unit's Type.
#
# AGENT-GUARD: do not add a bare `BusName=` line here to "clear" the
# packaged unit's BusName=org.freedesktop.impl.portal.desktop.kde. systemd
# 261 does not treat an empty RHS as a reset for this directive; it logs
# "Invalid bus name, ignoring" on every unit (re)start (confirmed live on
# qinda-top, journalctl --user, repeating at 21:32/21:46/22:11/22:56 on
# 2026-09-16) and the man page states BusName= is only mandatory for
# Type=dbus, so leaving the inherited value in place under Type=exec is
# harmless and avoids the warning; systemctl service-log-level still
# resolves it correctly.
[Service]
Type=exec
Environment=XDG_CURRENT_DESKTOP=KDE
