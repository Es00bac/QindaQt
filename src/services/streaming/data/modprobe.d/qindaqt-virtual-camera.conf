# One loopback device, labelled so it is recognisable in the camera picker of
# every conferencing application rather than appearing as an unnamed
# "/dev/video2".
#
# exclusive_caps=1 makes the device advertise capture capability only while
# something is feeding it. Chromium and Firefox refuse a V4L2 device that
# claims both output and capture at once, so without this the virtual camera
# is invisible in exactly the applications people use it with.
options v4l2loopback devices=1 exclusive_caps=1 card_label="QindaQt Virtual Camera"
